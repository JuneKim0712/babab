<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mock Amazon.com: echo dot</title>
  <style>
    /* Intentionally aggressive "Amazon-like" CSS to prove the chips are isolated by Shadow DOM. */
    body { font-family: Arial, sans-serif; margin: 0; background: #fff; color: #0f1111; }
    div, span, button, a, strong { color: #c40000 !important; font-size: 17px !important; letter-spacing: 2px !important; }
    #search { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .s-main-slot { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
    .s-result-item { border: 1px solid #d5d9d9; border-radius: 8px; padding: 12px; }
    h2, h2 a, h2 span { font-size: 15px !important; color: #0f1111 !important; letter-spacing: 0 !important; }
    .a-price { display: inline-block; }
    .a-offscreen { position: absolute; left: -10000px; }
    .a-price-whole { font-size: 24px !important; }
    .a-text-price { text-decoration: line-through; }
    .a-icon-alt { position: absolute; left: -10000px; }
  </style>
</head>
<body>
  <div id="nav-subnav" data-category="amazon-devices"></div>
  <select id="searchDropdownBox"><option>All Departments</option><option>Amazon Devices</option></select>
  <div id="search">
    <div class="s-main-slot s-result-list">
      <div data-component-type="s-search-result" data-asin="B0SEARCH01" class="s-result-item">
        <h2><a href="#"><span>Echo Dot (5th Gen) smart speaker with Alexa</span></a></h2>
        <span class="a-icon-alt">4.7 out of 5 stars</span>
        <div data-cy="price-recipe"><div class="a-row">
          <span class="a-price"><span class="a-offscreen">$49.99</span><span aria-hidden="true"><span class="a-price-whole">49</span><span class="a-price-fraction">99</span></span></span>
          <span class="a-price a-text-price"><span class="a-offscreen">$69.99</span></span>
        </div></div>
      </div>

      <div data-component-type="s-search-result" data-asin="B0SEARCH02" class="s-result-item">
        <h2><a href="#"><span>Echo Show 8 (3rd Gen) HD smart display</span></a></h2>
        <span class="a-icon-alt">4.6 out of 5 stars</span>
        <div class="a-row">
          <span class="a-price"><span class="a-offscreen">$149.99</span></span>
        </div>
      </div>

      <div data-component-type="s-search-result" data-asin="B0SEARCH03" class="s-result-item">
        <h2><a href="#"><span>Echo Pop compact smart speaker (no price shown)</span></a></h2>
        <div class="a-row"><a href="#">See options</a></div>
      </div>

      <div data-component-type="s-search-result" data-asin="B0SEARCH04" class="s-result-item">
        <h2><a href="#"><span>Fire TV Stick 4K Max streaming device</span></a></h2>
        <div class="a-row">
          <span class="a-price"><span aria-hidden="true"><span class="a-price-whole">59<span class="a-price-decimal">.</span></span><span class="a-price-fraction">99</span></span></span>
        </div>
      </div>
    </div>
    <button id="load-more" type="button">Load more results</button>
  </div>
  <script>
    document.getElementById('load-more').addEventListener('click', () => {
      setTimeout(() => {
        const card = document.createElement('div');
        card.className = 's-result-item';
        card.setAttribute('data-component-type', 's-search-result');
        card.setAttribute('data-asin', 'B0SEARCH05');
        card.innerHTML = '<h2><a href="#"><span>Kindle Paperwhite (16 GB)</span></a></h2>' +
          '<div class="a-row"><span class="a-price"><span class="a-offscreen">$159.99</span></span></div>';
        document.querySelector('.s-main-slot').appendChild(card);
      }, 200);
    });
  </script>
</body>
</html>
