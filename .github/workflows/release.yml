name: Release

# Push a tag like v1.0.0 to publish a GitHub Release with PriceOracle.zip attached.
# If the tag push did not trigger this workflow, run it by hand: Actions > Release > Run workflow, tag = v1.0.0.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (for example v1.1.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches manifest version
        working-directory: amazon-price-oracle
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          v=$(node -p "require('./manifest.json').version")
          if [ "v$v" != "${TAG}" ]; then echo "Tag ${TAG} != manifest version v$v"; exit 1; fi
      - name: Unit tests
        working-directory: amazon-price-oracle
        run: npm test
      - name: Build zip
        working-directory: amazon-price-oracle
        run: npm run pack -- "$GITHUB_WORKSPACE/PriceOracle.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" PriceOracle.zip \
            --title "PriceOracle $TAG" \
            --notes "Download PriceOracle.zip, unzip, then chrome://extensions > Developer mode > Load unpacked. See the README for details."
